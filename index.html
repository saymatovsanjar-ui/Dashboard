<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREflow Pro - Property & Tenant Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #0b1219;
            --sidebar-bg: #111b26;
            --card-bg: #162231;
            --border: #1f3246;
            --text: #e8edf3;
            --text-secondary: #8fa3b8;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --purple: #8b5cf6;
            --teal: #14b8a6;
            --pink: #ec4899;
            --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ── TOP BAR ── */
        .top-bar {
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 200;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-bar .logo { font-size: 1.1rem; font-weight: 700; cursor: pointer; }
        .top-bar .logo i { color: var(--accent-light); }
        .sync-badge {
            font-size: 0.7rem;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        .sync-badge.online { background: rgba(16,185,129,0.15); color: var(--green); }
        .sync-badge.offline { background: rgba(245,158,11,0.15); color: var(--amber); }
        .sync-badge.saving { background: rgba(59,130,246,0.15); color: var(--accent-light); }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            position: fixed;
            top: 49px; left: 0; bottom: 0;
            z-index: 100;
            transition: transform 0.25s;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-nav { padding: 14px 10px; flex: 1; }
        .sidebar-nav .nav-section {
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            color: var(--text-secondary);
            padding: 14px 10px 6px;
            font-weight: 700;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 9px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 2px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sidebar-nav a:hover { background: rgba(255,255,255,0.04); color: var(--text); }
        .sidebar-nav a.active { background: rgba(59,130,246,0.15); color: var(--accent-light); font-weight: 600; }
        .sidebar-nav a .badge {
            margin-left: auto;
            background: var(--accent);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 9px;
            border-radius: 20px;
            font-weight: 600;
        }
        .sidebar-nav a .badge.warn { background: var(--amber); color: #000; }
        .sidebar-nav a .badge.green { background: var(--green); color: #000; }
        .sidebar-nav a .badge.red { background: var(--red); }
        .sidebar-footer {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            font-size: 0.68rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .sidebar-footer button {
            width: 100%;
            padding: 7px 10px;
            font-size: 0.68rem;
            border-radius: 6px;
            text-align: left;
        }

        /* ── MAIN ── */
        .main {
            margin-left: 260px;
            margin-top: 49px;
            padding: 24px 28px;
            min-height: calc(100vh - 49px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            margin-bottom: 22px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .icon-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stat-card .icon-circle {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .icon-circle.blue { background: rgba(59,130,246,0.2); color: var(--accent-light); }
        .icon-circle.green { background: rgba(16,185,129,0.2); color: var(--green); }
        .icon-circle.amber { background: rgba(245,158,11,0.2); color: var(--amber); }
        .icon-circle.purple { background: rgba(139,92,246,0.2); color: var(--purple); }
        .icon-circle.teal { background: rgba(20,184,166,0.2); color: var(--teal); }
        .icon-circle.red { background: rgba(239,68,68,0.2); color: var(--red); }
        .icon-circle.pink { background: rgba(236,72,153,0.2); color: var(--pink); }
        .stat-card .value { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
        .stat-card .label { color: var(--text-secondary); font-size: 0.78rem; margin-top: 2px; }
        .stat-card .trend { font-size: 0.76rem; margin-top: 4px; font-weight: 500; }
        .trend.up { color: var(--green); }
        .trend.down { color: var(--red); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            margin-bottom: 18px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .card-header h3 { font-size: 1rem; font-weight: 600; }
        .card-header .link { color: var(--accent-light); font-size: 0.8rem; cursor: pointer; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        th {
            text-align: left;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            white-space: nowrap;
        }
        td { padding: 10px 8px; border-bottom: 1px solid rgba(31,50,70,0.5); white-space: nowrap; }
        tr:last-child td { border-bottom: none; }
        tr.urgent { background: rgba(239,68,68,0.08); }
        tr.warning-row { background: rgba(245,158,11,0.06); }

        .status {
            display: inline-block;
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status.occupied { background: rgba(16,185,129,0.15); color: var(--green); }
        .status.vacant { background: rgba(239,68,68,0.15); color: var(--red); }
        .status.negotiating { background: rgba(245,158,11,0.15); color: var(--amber); }
        .status.available { background: rgba(20,184,166,0.15); color: var(--teal); }
        .status.expiring { background: rgba(239,68,68,0.2); color: var(--red); }
        .status.renewed { background: rgba(16,185,129,0.2); color: var(--green); }

        .days-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .days-badge.critical { background: rgba(239,68,68,0.3); color: #fca5a5; }
        .days-badge.warning { background: rgba(245,158,11,0.3); color: #fcd34d; }
        .days-badge.ok { background: rgba(16,185,129,0.2); color: #6ee7b7; }

        .expiry-timeline { display: flex; gap: 12px; overflow-x: auto; padding: 8px 0; }
        .expiry-month-card {
            min-width: 200px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            flex-shrink: 0;
        }
        .expiry-month-card h4 { font-size: 0.9rem; margin-bottom: 8px; color: var(--accent-light); }
        .expiry-item { padding: 6px 0; border-bottom: 1px solid rgba(31,50,70,0.4); font-size: 0.78rem; }
        .expiry-item:last-child { border-bottom: none; }

        .commission-highlight {
            background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(59,130,246,0.1));
            border: 1px solid rgba(139,92,246,0.3);
        }
        .highlight-green { color: var(--green); font-weight: 700; }
        .highlight-red { color: var(--red); font-weight: 700; }
        .highlight-amber { color: var(--amber); font-weight: 700; }

        .property-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .property-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }
        .property-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .property-card .card-top { padding: 18px 20px; }
        .property-card h4 { font-size: 1rem; margin-bottom: 4px; }
        .property-card .address { color: var(--text-secondary); font-size: 0.78rem; }
        .property-card .card-bottom {
            border-top: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            font-size: 0.76rem;
            color: var(--text-secondary);
        }

        button {
            padding: 10px 18px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }
        button:hover { border-color: #4a5568; background: #1e3044; }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        button.primary:hover { background: #2563eb; }
        button.success { background: var(--green); border-color: var(--green); color: #000; font-weight: 600; }
        button.danger { background: transparent; border-color: var(--red); color: var(--red); }
        button.warning { background: transparent; border-color: var(--amber); color: var(--amber); }
        button.small { padding: 5px 12px; font-size: 0.75rem; border-radius: 6px; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .modal h3 { margin-bottom: 18px; font-size: 1.2rem; }
        .modal label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .modal input, .modal select, .modal textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.88rem;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .modal textarea { resize: vertical; min-height: 70px; }
        .modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .modal .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

        @media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr !important; } }
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; }
            .mobile-toggle { display: block !important; }
            .modal .form-row, .modal .form-row-3 { grid-template-columns: 1fr; }
        }
        @media (min-width: 901px) { .mobile-toggle { display: none !important; } }
        @media (max-width: 600px) {
            .main { padding: 14px 12px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .property-grid { grid-template-columns: 1fr; }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            z-index: 9999;
            animation: fadeInOut 2.5s ease;
            font-family: inherit;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>

        <div class="nav-section">Financials</div>
        <a data-page="commissions" onclick="navigateTo('commissions', this)"><i class="fas fa-dollar-sign"></i> Commissions</a>

        <div class="nav-section">Workflow</div>

    </nav>
    <div class="sidebar-footer">
        <small style="color:var(--text-secondary);">Data synced to Firebase ☁️</small>
    </div>
</aside>

<!-- ═══════════ MAIN CONTENT ═══════════ -->
<main class="main" id="mainContent">
    <div style="text-align:center;padding:80px 20px;">
        <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--accent-light);"></i>
        <p style="margin-top:16px;color:var(--text-secondary);">Loading from cloud...</p>
    </div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">

// FIREBASE SYNC
// ═══════════════════════════════════════
async function loadFromCloud() {
    try {
        setSyncStatus('saving', 'Loading...');
        const doc = await db.collection('dashboard').doc(CLOUD_DOC_ID).get();
        if (doc.exists && doc.data().data) {
            data = doc.data().data;
            dataLoaded = true;
            setSyncStatus('online', '☁️ Synced');
            const updated = doc.data().updatedAt;
            if (updated && updated.toDate) {
                document.getElementById('lastUpdated').textContent = 'Updated: ' + updated.toDate().toLocaleString();
            }
            console.log('✅ Loaded from Firestore');
        } else {
            data = getDefaultData();
            await saveToCloud(true);
            setSyncStatus('online', '☁️ Initialized');
            console.log('📦 Seeded default data to cloud');
        }
    } catch (e) {
        console.error('Cloud load failed, trying localStorage...', e);
        const saved = localStorage.getItem('creflow_fallback_v4');
        if (saved) {
            try {
                data = JSON.parse(saved);
                setSyncStatus('offline', '⚠️ Offline (local)');
            } catch(ex) {
                data = getDefaultData();
                setSyncStatus('offline', '⚠️ Offline (defaults)');
            }
        } else {
            data = getDefaultData();
            setSyncStatus('offline', '⚠️ Offline (defaults)');
        }
    }
    dataLoaded = true;
    updateCounts();
    renderDashboard();
}

async function saveToCloud(silent = false) {
    if (!data || !dataLoaded) return;
    if (!silent) setSyncStatus('saving', 'Saving...');
    try {
        await db.collection('dashboard').doc(CLOUD_DOC_ID).set({
            data: data,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        if (!silent) setSyncStatus('online', '☁️ Synced');
        document.getElementById('lastUpdated').textContent = 'Updated: just now';
        localStorage.setItem('creflow_fallback_v4', JSON.stringify(data));
    } catch (e) {
        console.error('Cloud save failed, using localStorage', e);
        localStorage.setItem('creflow_fallback_v4', JSON.stringify(data));
        setSyncStatus('offline', '⚠️ Saved locally');
    }
}

function scheduleCloudSave() {
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => saveToCloud(), 800);
}

async function syncNow() {
    await saveToCloud();
    showToast('☁️ Synced to cloud');
}

function setSyncStatus(cls, text) {
    const badge = document.getElementById('syncBadge');
    if (badge) {
        badge.className = 'sync-badge ' + cls;
        badge.textContent = text;
    }
}

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function getClientById(id) { return data?.clients?.find(c => c.id === id); }
function getPropertyById(id) { return data?.properties?.find(p => p.id === id); }
function formatCurrency(num) { return '$' + (num || 0).toLocaleString(); }
function formatDate(dateStr) { return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); }
function daysFromNow(dateStr) { return Math.ceil((new Date(dateStr+'T00:00:00') - new Date()) / (1000*60*60*24)); }
function daysBetween(d1, d2) { return Math.ceil((new Date(d2+'T00:00:00') - new Date(d1+'T00:00:00')) / (1000*60*60*24)); }

function getExpiringLeases(months = 3) {
    if (!data) return [];
    const now = new Date();
    const cutoff = new Date(now);
    cutoff.setMonth(cutoff.getMonth() + months);
    const nowStr = now.toISOString().split('T')[0];
    const cutoffStr = cutoff.toISOString().split('T')[0];
    return data.properties.flatMap(p =>
        p.lots.filter(l => l.currentTenant && l.currentTenant.leaseEnd >= nowStr && l.currentTenant.leaseEnd <= cutoffStr)
            .map(l => ({ ...l, propName: p.name, propId: p.id, daysLeft: daysFromNow(l.currentTenant.leaseEnd), tenant: getClientById(l.currentTenant.clientId) }))
    ).sort((a, b) => a.daysLeft - b.daysLeft);
}

function getExpirationsByMonth(months = 6) {
    if (!data) return [];
    const now = new Date();
    const result = [];
    for (let i = 0; i < months; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        const expiring = data.properties.flatMap(p =>
            p.lots.filter(l => l.currentTenant && l.currentTenant.leaseEnd >= d.toISOString().split('T')[0] && l.currentTenant.leaseEnd <= end.toISOString().split('T')[0])
                .map(l => ({ ...l, propName: p.name, propId: p.id, daysLeft: daysFromNow(l.currentTenant.leaseEnd), tenant: getClientById(l.currentTenant.clientId) }))
        );
        result.push({ month: d.toLocaleDateString('en-US', { month:'long', year:'numeric' }), units: expiring, totalRentAtRisk: expiring.reduce((s,u)=>s+(u.currentTenant?.rentMonthly||0),0) });
    }
    return result;
}

function calculateCommission(lot, isRenewal = false) {
    if (!data) return 0;
    if (!lot.currentTenant && !lot.commission) return 0;
    const rate = isRenewal ? data.commissionDefaults.renewalRate : data.commissionDefaults.newLeaseRate;
    let annual = 0;
    if (isRenewal && lot.currentTenant) annual = lot.currentTenant.rentMonthly * 12;
    else if (lot.commission) return lot.commission.estimatedValue || 0;
    else if (lot.currentTenant) annual = lot.currentTenant.rentMonthly * 12;
    else return 0;
    if (data.commissionDefaults.opexIncluded && lot.currentTenant) annual += lot.currentTenant.opexMonthly * 12;
    return Math.round(annual * rate / 100);
}

function getCommissionPipeline() {
    if (!data) return { newLease: [], renewal: [], totalNew: 0, totalRenewal: 0, total: 0 };
    const newLease = data.properties.flatMap(p =>
        p.lots.filter(l => (l.status==='vacant'||l.status==='negotiating') && l.commission)
            .map(l => ({ type:'New Lease', property:p.name, lot:l.lotName, sqFt:l.sqFt, potentialTenants:(l.potentialTenants||[]).map(id=>getClientById(id)).filter(Boolean), estimatedCommission:calculateCommission(l,false), status:l.status }))
    );
    const renewal = getExpiringLeases(6).map(l => ({ type:'Renewal', property:l.propName, lot:l.lotName, sqFt:l.sqFt, tenant:l.tenant, leaseEnd:l.currentTenant.leaseEnd, renewalLikelihood:l.currentTenant.renewalLikelihood||'unknown', estimatedCommission:calculateCommission(l,true), status:l.status }));
    return {
        newLease, renewal,
        totalNew: newLease.reduce((s,c)=>s+c.estimatedCommission,0),
        totalRenewal: renewal.reduce((s,c)=>s+c.estimatedCommission,0),
        total: newLease.reduce((s,c)=>s+c.estimatedCommission,0) + renewal.reduce((s,c)=>s+c.estimatedCommission,0)
    };
}

function viewProperty(propId) {
    const prop = getPropertyById(propId);
    if (!prop) return;
    const occupied = prop.lots.filter(l=>l.status==='occupied').length;
    const totalRent = prop.lots.filter(l=>l.currentTenant).reduce((s,l)=>s+(l.currentTenant.rentMonthly||0),0);

    mainContent.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
            <div><h2>${prop.name}</h2><div style="color:var(--text-secondary);font-size:0.85rem;"><span style="cursor:pointer;color:var(--accent-light);" onclick="navigateTo('properties',document.querySelector('[data-page=properties]'))">Properties</span> / ${prop.name}</div></div>
            <div style="display:flex;gap:8px;">
                <button onclick="openLotModal(${prop.id})"><i class="fas fa-plus"></i> Add Lot</button>
                <button class="primary" onclick="openPropertyModal(${prop.id})"><i class="fas fa-edit"></i> Edit Property</button>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="icon-row"><div class="icon-circle blue"><i class="fas fa-cubes"></i></div></div><div class="value">${prop.lots.length}</div><div class="label">Total Units</div></div>
            <div class="stat-card"><div class="icon-row"><div class="icon-circle green"><i class="fas fa-user-check"></i></div></div><div class="value">${occupied}</div><div class="label">Occupied</div><div class="trend up">${formatCurrency(totalRent)}/mo</div></div>
            <div class="stat-card"><div class="icon-row"><div class="icon-circle amber"><i class="fas fa-door-open"></i></div></div><div class="value">${prop.lots.length-occupied}</div><div class="label">Vacant</div></div>
            <div class="stat-card"><div class="icon-row"><div class="icon-circle teal"><i class="fas fa-ruler-combined"></i></div></div><div class="value">${prop.totalSqFt.toLocaleString()}</div><div class="label">Total Sq Ft</div></div>
        </div>
        <div class="card"><div class="card-header"><h3><i class="fas fa-cubes"></i> Lots / Units</h3></div>
            <div class="table-wrap"><table><thead><tr><th>Lot</th><th>Sq Ft</th><th>Floor</th><th>Status</th><th>Tenant</th><th>Lease Start</th><th>Lease End</th><th>Rent/Mo</th><th>OPEX/Mo</th><th>Renewal</th><th>Commission</th><th>Actions</th></tr></thead><tbody>
                ${prop.lots.map(l => {
                    const client = l.currentTenant ? getClientById(l.currentTenant.clientId) : null;
                    const potentials = (l.potentialTenants||[]).map(id=>getClientById(id)).filter(Boolean);
                    const dl = l.currentTenant ? daysFromNow(l.currentTenant.leaseEnd) : null;
                    const commNew = l.commission ? calculateCommission(l,false) : 0;
                    const commRen = l.currentTenant ? calculateCommission(l,true) : 0;
                    return `<tr class="${dl&&dl<=90?'warning-row':''} ${dl&&dl<=30?'urgent':''}">
                        <td><strong>${l.lotName}</strong></td><td>${l.sqFt.toLocaleString()}</td><td>${l.floor}</td>
                        <td><span class="status ${l.status}">${l.status.charAt(0).toUpperCase()+l.status.slice(1)}</span></td>
                        <td>${client?`<strong>${client.company}</strong><br><small>${client.contact}</small>`:'—'}</td>
                        <td>${l.currentTenant?formatDate(l.currentTenant.leaseStart):'—'}</td>
                        <td>${l.currentTenant?formatDate(l.currentTenant.leaseEnd)+(dl&&dl<=90?` <span class="days-badge ${dl<=30?'critical':'warning'}">${dl}d</span>`:''):'—'}</td>
                        <td>${l.currentTenant?formatCurrency(l.currentTenant.rentMonthly):'—'}</td>
                        <td>${l.currentTenant?formatCurrency(l.currentTenant.opexMonthly):'—'}</td>
                        <td>${l.currentTenant?`<span class="status ${l.currentTenant.renewalLikelihood==='likely'?'renewed':l.currentTenant.renewalLikelihood==='unlikely'?'expiring':'negotiating'}">${l.currentTenant.renewalLikelihood||'pending'}</span>`:'—'}</td>
                        <td>${commNew>0?`<span class="highlight-green">${formatCurrency(commNew)}</span>`:commRen>0?`<span class="highlight-amber">${formatCurrency(commRen)}</span>`:'—'}</td>
                        <td>
                            <button class="small" onclick="editLot(${prop.id},${l.id})"><i class="fas fa-edit"></i></button>
                            ${l.currentTenant?`<button class="small warning" style="margin-left:3px;" onclick="openRenewalModal(${prop.id},${l.id})"><i class="fas fa-rotate"></i></button>`:''}
                            ${l.status==='vacant'||l.status==='negotiating'?`<button class="small success" style="margin-left:3px;" onclick="assignPotentialTenant(${prop.id},${l.id})">+Prospect</button>`:''}

function filterUnits(status) {
    document.querySelectorAll('#unitsTable tbody tr').forEach(tr => {
        tr.style.display = (status==='all'||tr.dataset.status===status) ? '' : 'none';
    });
}

                ${pipeline.renewal.length>0?`<tr style="font-weight:700;border-top:2px solid var(--border);"><td colspan="4">Total Renewal Pipeline</td><td class="highlight-amber">${formatCurrency(pipeline.totalRenewal)}</td></tr>`:''}
            </tbody></table></div></div>
        </div>
        <div class="card commission-highlight" style="margin-top:18px;"><div class="card-header"><h3><i class="fas fa-calculator"></i> Quick Commission Calculator</h3></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
                <div><label style="font-size:0.75rem;color:var(--text-secondary);">Monthly Rent ($)</label><input type="number" id="calcRent" value="15000" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);" oninput="updateCalc()"></div>
                <div><label style="font-size:0.75rem;color:var(--text-secondary);">Monthly OPEX ($)</label><input type="number" id="calcOpex" value="3000" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);" oninput="updateCalc()"></div>
                <div><label style="font-size:0.75rem;color:var(--text-secondary);">Rate (%)</label><input type="number" id="calcRate" value="${data.commissionDefaults.newLeaseRate}" step="0.5" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);" oninput="updateCalc()"></div>
                <div><label style="font-size:0.75rem;color:var(--text-secondary);">Include OPEX</label><select id="calcOpexInc" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);" onchange="updateCalc()"><option value="no">No</option><option value="yes">Yes</option></select></div>
                <div style="display:flex;align-items:flex-end;"><div style="width:100%;padding:8px;background:rgba(139,92,246,0.15);border-radius:6px;text-align:center;"><div style="font-size:0.7rem;color:var(--text-secondary);">ESTIMATED COMMISSION</div><div id="calcResult" style="font-size:1.3rem;font-weight:700;color:var(--purple);">$9,000</div></div></div>
            </div>
        </div>
    `;
    setTimeout(updateCalc, 50);
}

function updateCalc() {
    const rent = parseInt(document.getElementById('calcRent')?.value) || 0;
    const opex = parseInt(document.getElementById('calcOpex')?.value) || 0;
    const rate = parseFloat(document.getElementById('calcRate')?.value) || 0;
    const incOpex = document.getElementById('calcOpexInc')?.value === 'yes';
    const annual = incOpex ? (rent+opex)*12 : rent*12;
    const commission = Math.round(annual * rate / 100);
    const resultEl = document.getElementById('calcResult');
    if (resultEl) resultEl.textContent = formatCurrency(commission);
}

function saveLot(propId) {
    const prop = getPropertyById(propId); if(!prop) return;
    const status = document.getElementById('lotStatus').value;
    const tenantId = parseInt(document.getElementById('lotTenant').value)||null;
    const nl = {
        id: Math.max(...data.properties.flatMap(p=>p.lots.map(l=>l.id)),0)+1,
        lotName: document.getElementById('lotName').value.trim(),
        sqFt: parseInt(document.getElementById('lotSqFt').value)||0,
        floor: parseInt(document.getElementById('lotFloor').value)||1,
        status,
        currentTenant: (status==='occupied'&&tenantId) ? { clientId:tenantId, leaseStart:document.getElementById('leaseStart').value, leaseEnd:document.getElementById('leaseEnd').value, rentMonthly:parseInt(document.getElementById('leaseRent').value)||0, opexMonthly:parseInt(document.getElementById('leaseOpex').value)||0, renewalLikelihood:'uncertain', renewalNotes:'' } : null,
        potentialTenants: []
    };
    prop.lots.push(nl);
    closeModal(); scheduleCloudSave(); viewProperty(propId);
}

function editLot(propId, lotId) {
    const prop = getPropertyById(propId); if(!prop) return;
    const lot = prop.lots.find(l=>l.id===lotId); if(!lot) return;
    const mc = document.getElementById('modalContent');
    mc.innerHTML = `
        <h3>Edit Lot: ${lot.lotName}</h3>

    `;
    document.getElementById('lotStatus').addEventListener('change',function(){document.getElementById('leaseFields').style.display=this.value==='occupied'?'block':'none';});
    document.getElementById('modalOverlay').classList.add('show');
}

function updateLot(propId, lotId) {
    const prop = getPropertyById(propId); if(!prop) return;
    const lot = prop.lots.find(l=>l.id===lotId); if(!lot) return;
    const status = document.getElementById('lotStatus').value;
    const tenantId = parseInt(document.getElementById('lotTenant').value)||null;
    lot.lotName = document.getElementById('lotName').value.trim();
    lot.sqFt = parseInt(document.getElementById('lotSqFt').value)||0;
    lot.floor = parseInt(document.getElementById('lotFloor').value)||1;
    lot.status = status;
    if (status==='occupied'&&tenantId) { lot.currentTenant = { clientId:tenantId, leaseStart:document.getElementById('leaseStart').value, leaseEnd:document.getElementById('leaseEnd').value, rentMonthly:parseInt(document.getElementById('leaseRent').value)||0, opexMonthly:parseInt(document.getElementById('leaseOpex').value)||0, renewalLikelihood:lot.currentTenant?.renewalLikelihood||'uncertain', renewalNotes:lot.currentTenant?.renewalNotes||'' }; }
    else { lot.currentTenant = null; }
    closeModal(); scheduleCloudSave(); viewProperty(propId);
}

function deleteLot(propId, lotId) {
    if (!confirm('Delete this lot? This cannot be undone.')) return;
    const prop = getPropertyById(propId); if(prop) prop.lots = prop.lots.filter(l=>l.id!==lotId);
    closeModal(); scheduleCloudSave(); viewProperty(propId);
}

function saveRenewalStatus(propId, lotId) {

function deleteTask(id) {
    if(!confirm('Delete this task?')) return;
    data.tasks = data.tasks.filter(t=>t.id!==id);
    scheduleCloudSave(); renderPage('tasks');
}

function openCommissionSettingsModal() {
    const mc = document.getElementById('modalContent');
    mc.innerHTML = `
        <h3><i class="fas fa-cog"></i> Commission Settings</h3>
        <div class="form-row"><div><label>New Lease Rate (%)</label><input type="number" id="setNewRate" value="${data.commissionDefaults.newLeaseRate}" step="0.5" min="0" max="20"></div><div><label>Renewal Rate (%)</label><input type="number" id="setRenewalRate" value="${data.commissionDefaults.renewalRate}" step="0.5" min="0" max="20"></div></div>
        <label>Include OPEX in Commission?</label><select id="setOpexIncluded"><option value="yes" ${data.commissionDefaults.opexIncluded?'selected':''}>Yes — Commission on Rent + OPEX</option><option value="no" ${!data.commissionDefaults.opexIncluded?'selected':''}>No — Commission on Rent Only</option></select>
        <div class="btn-row"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveCommissionSettings()">Save Settings</button></div>
    `;
    document.getElementById('modalOverlay').classList.add('show');
}

function saveCommissionSettings() {
    data.commissionDefaults.newLeaseRate = parseFloat(document.getElementById('setNewRate').value)||5;
    data.commissionDefaults.renewalRate = parseFloat(document.getElementById('setRenewalRate').value)||2.5;
    data.commissionDefaults.opexIncluded = document.getElementById('setOpexIncluded').value==='yes';
    closeModal(); scheduleCloudSave(); renderPage('commissions'); showToast('Commission settings updated!');
}

// ═══════════════════════════════════════
// DATA MANAGEMENT
// ═══════════════════════════════════════
function exportData() {
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `creflow-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('📥 Backup downloaded!');
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const imported = JSON.parse(ev.target.result);
                if(imported.properties && imported.clients) {
                    if(confirm('Restore backup? Current data will be replaced.')) {
                        data = imported;
                        scheduleCloudSave();
                        updateCounts();
                        renderDashboard();
                        showToast('✅ Data restored & synced!');
                    }
                } else { alert('Invalid backup file.'); }
            } catch(ex) { alert('Could not read file.'); }
        };
        reader.readAsText(file);
    };
    input.click();
}

function resetAllData() {
    if(!confirm('⚠️ Delete ALL data and reset to defaults? This cannot be undone.')) return;
    data = getDefaultData();
    scheduleCloudSave();
    updateCounts();
    renderDashboard();
    showToast('Data reset to defaults');
}

// ═══════════════════════════════════════
// MODAL HELPERS
// ═══════════════════════════════════════
function closeModal(e) {
    if(e && e.target !== document.getElementById('modalOverlay') && e.type !== 'click') return;
    document.getElementById('modalOverlay').classList.remove('show');
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('show'); });

function showToast(msg) {
    const existing = document.querySelector('.toast'); if(existing) existing.remove();
    const toast = document.createElement('div'); toast.className = 'toast';
    toast.style.cssText = 'position:fixed;bottom:30px;right:30px;background:var(--green);color:#000;padding:12px 24px;border-radius:8px;font-weight:600;z-index:9999;animation:fadeInOut 2.5s ease;font-family:inherit;';
    toast.textContent = msg; document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}
